<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CAIXA PRETA Vip™ - Coliseu Virtual</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background-color: #000;
    color: #C6A75E;
  }

  /* Container principal */
  #coliseu-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: url('https://i.imgur.com/3hQG7Pt.jpg') no-repeat center center/cover; /* placeholder coliseu */
    filter: brightness(0.5) contrast(1.2);
  }

  /* Canvas de partículas/fluidos */
  #flowCanvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  /* Botões flutuantes */
  .flow-button {
    position: absolute;
    padding: 12px 24px;
    background: rgba(198, 167, 94, 0.8);
    color: #000;
    border: 2px solid #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
    z-index: 2;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .flow-button:hover {
    transform: scale(1.15);
    box-shadow: 0 0 20px #C6A75E, 0 0 40px #fff;
  }

</style>
</head>
<body>

<div id="coliseu-container">
  <canvas id="flowCanvas"></canvas>

  <!-- Botões flutuantes -->
  <a href="https://cpv2026.github.io/Auditorium/MontagemPost" class="flow-button" style="top: 20%; left: 15%;">Montagem de Post</a>
  <a href="https://cpv2026.github.io/Auditorium/Galeria" class="flow-button" style="top: 40%; left: 70%;">Galeria de Imagens</a>
  <a href="https://cpv2026.github.io/Auditorium/Lancamentos" class="flow-button" style="top: 70%; left: 30%;">Lançamentos</a>
  <a href="https://cpv2026.github.io/Auditorium/FluxoCoerencia" class="flow-button" style="top: 60%; left: 50%;">Fluxo de Coerência</a>

</div>

<script>
  // Canvas e partículas para fluxo
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;

  const particles = [];
  const particleCount = 120;

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.size = 1 + Math.random() * 3;
      this.speedX = -1 + Math.random() * 2;
      this.speedY = -1 + Math.random() * 2;
      this.alpha = 0.1 + Math.random() * 0.4;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(198,167,94,${this.alpha})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }

  animate();

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  });

</script>

</body>
</html>
