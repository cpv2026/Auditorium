<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Imersão 3D - Portal Nome X</title>
<style>
body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; }
button { position:absolute; top:20px; left:20px; padding:10px 20px; background:#111; color:#FFD700; border:none; cursor:pointer; z-index:10; }
</style>
</head>
<body>

<button onclick="criarPortal()">Abrir Portal</button>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";

let scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.05);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,5);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.enablePan = true;
controls.enableZoom = true;
controls.target.set(0,1,0);

let portals = [];

function criarPortal() {
    let geometry = new THREE.PlaneGeometry(2,2,64,64);

    let material = new THREE.ShaderMaterial({
        uniforms:{
            time:{value:0}
        },
        vertexShader:`
            uniform float time;
            varying vec2 vUv;
            void main(){
                vUv = uv;
                vec3 pos = position;
                float dist = length(uv - vec2(0.5));
                pos.z += sin(dist*15.0 - time*3.0)*0.05;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
            }
        `,
        fragmentShader:`
            varying vec2 vUv;
            void main(){
                float dist = distance(vUv, vec2(0.5));
                float alpha = smoothstep(0.5, 0.2, dist);
                gl_FragColor = vec4(0.0,0.0,0.0,alpha*0.6);
            }
        `,
        transparent:true
    });

    let portal = new THREE.Mesh(geometry, material);
    portal.position.x = (Math.random()-0.5)*4;
    portal.position.y = (Math.random()-0.5)*3;
    portal.userData.maximizado = false;

    portal.callback = function() {
        portal.userData.maximizado = !portal.userData.maximizado;
        if(portal.userData.maximizado){
            portal.position.set(0,1,0);
            portal.scale.set(3,3,3);
        } else {
            portal.position.x = (Math.random()-0.5)*4;
            portal.position.y = (Math.random()-0.5)*3;
            portal.scale.set(1,1,1);
        }
    };

    scene.add(portal);
    portals.push(portal);
}

let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let lastClick = 0;

function onClick(event){
    mouse.x = (event.clientX / window.innerWidth)*2 - 1;
    mouse.y = -(event.clientY / window.innerHeight)*2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(portals);
    if(intersects.length>0){
        let now = Date.now();
        if(now - lastClick < 300){
            intersects[0].object.callback();
        }
        lastClick = now;
    }
}
window.addEventListener('click', onClick);

function animate(){
    requestAnimationFrame(animate);
    portals.forEach(p=>{
        p.material.uniforms.time.value += 0.02;
        p.rotation.z += 0.001;
    });
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
